<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <main class="main">
      <div class="product">
        <div
          class="product__card"
          data-qa="card"
        >
          <img
            src="./images/imac.jpeg"
            alt="imac-img"
            class="product__img"
          />
          <div class="product__content">
            <div class="product__title">
              APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
            </div>
            <p class="product__code">Product code: 195434</p>
            <div class="product__reviews">
              <div class="stars">
                <div class="stars__star stars__star--1"></div>
                <div class="stars__star stars__star--2"></div>
                <div class="stars__star stars__star--3"></div>
                <div class="stars__star stars__star--4"></div>
                <div class="stars__star stars__star--5"></div>
              </div>
              <p class="product__reviews-text">Reviews: 5</p>
            </div>
            <div class="product__price-block">
              <p class="product__price-text">Price:</p>
              <div class="product__price">$2,199</div>
            </div>
            <a
              href="#"
              class="product__buy-button"
              data-qa="hover"
            >
              buy
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
